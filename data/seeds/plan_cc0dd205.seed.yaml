  - node: n-final-verify
    iframe: null
    required_output: typecheck, package tests, browser verification
    acceptance: AC-VERIFY-001, AC-VERIFY-002
    status: pending

evaluation_principles:
  - name: Traceability over file-diff confidence
    weight: 0.35
    description: Completion must be judged from approved node evidence and AC coverage, not from a list of changed files.
  - name: Node-owned HTML interpretation
    weight: 0.2
    description: Iframe HTML evidence must remain attached to the owning graph node while deriving outputs and criteria.
  - name: Minimal scope
    weight: 0.15
    description: PreviewShell/PreviewPanel must stay minimal and avoid speculative helpers.
  - name: Runtime correctness
    weight: 0.15
    description: UI behavior must be verified in the browser when interaction behavior is changed.
  - name: Documentation clarity
    weight: 0.15
    description: Skills, MCP descriptions, AGENTS guidance, and template docs must say the same ownership model.

exit_conditions:
  - All acceptance_criteria pass.
  - traceability_matrix has no pending required_output.
  - Any deferred or rejected output has explicit rationale and user approval.
  - Final report lists each graph node with implemented/verified/deferred status.

metadata:
  seed_version: 1
  generated_from: agent-gui graph/html session plus node-owned iframe HTML
  generated_at: "2026-05-27"
  ambiguity_score: 0.18
  notes:
    - MCP-based ooo seed generation was intentionally not used.
    - This seed is a manual fallback-style crystallization based on ouroboros-seed skill structure.
