<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checklist Prototype</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17201b;
        background: #f7f7f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f7f7f4;
      }

      main {
        display: grid;
        gap: 18px;
        margin: 0 auto;
        max-width: 760px;
        padding: 28px;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        font-size: 24px;
        line-height: 1.2;
        margin: 0 0 6px;
      }

      p {
        color: #647067;
        line-height: 1.5;
        margin: 0;
      }

      .progress {
        min-width: 132px;
        text-align: right;
      }

      .progress strong {
        display: block;
        font-size: 24px;
      }

      .bar {
        background: #dde3dc;
        border-radius: 999px;
        height: 8px;
        margin-top: 8px;
        overflow: hidden;
      }

      .bar span {
        display: block;
        height: 100%;
        width: 0%;
        background: #0f766e;
        transition: width 180ms ease;
      }

      .toolbar,
      .checklist,
      .summary {
        background: white;
        border: 1px solid #d7d8d2;
        border-radius: 8px;
        box-shadow: 0 1px 3px rgba(20, 24, 18, 0.08);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px;
      }

      button {
        border: 1px solid #cbd5d1;
        border-radius: 6px;
        background: white;
        color: #17201b;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        min-height: 34px;
        padding: 7px 11px;
      }

      button.primary {
        background: #0f766e;
        border-color: #0f766e;
        color: white;
      }

      .checklist {
        display: grid;
      }

      .item {
        align-items: flex-start;
        border-bottom: 1px solid #ecefeb;
        display: grid;
        gap: 10px;
        grid-template-columns: auto 1fr auto;
        padding: 14px;
      }

      .item:last-child {
        border-bottom: 0;
      }

      input[type="checkbox"] {
        accent-color: #0f766e;
        height: 18px;
        margin-top: 2px;
        width: 18px;
      }

      .item h2 {
        font-size: 15px;
        margin: 0 0 4px;
      }

      .item.done h2 {
        color: #647067;
        text-decoration: line-through;
      }

      .tag {
        background: #edf2ef;
        border-radius: 999px;
        color: #52645a;
        font-size: 12px;
        font-weight: 650;
        line-height: 1;
        padding: 6px 8px;
      }

      .summary {
        display: grid;
        gap: 8px;
        padding: 14px;
      }

      .summary strong {
        color: #0f766e;
      }

      @media (max-width: 640px) {
        main {
          padding: 18px;
        }

        header,
        .item {
          grid-template-columns: 1fr;
        }

        .progress {
          text-align: left;
          width: 100%;
        }

        .item {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Plan Review Checklist</h1>
          <p>프로토타입 탭에 외부 웹앱을 그대로 띄우는 흐름을 확인하기 위한 간단한 체크리스트입니다.</p>
        </div>
        <div class="progress" aria-live="polite">
          <strong id="count">0 / 5</strong>
          <p id="status">아직 시작 전</p>
          <div class="bar" aria-hidden="true"><span id="bar"></span></div>
        </div>
      </header>

      <section class="toolbar" aria-label="Checklist actions">
        <button class="primary" id="complete-required" type="button">필수 항목 완료</button>
        <button id="reset" type="button">초기화</button>
      </section>

      <section class="checklist" id="checklist" aria-label="Review checklist"></section>

      <section class="summary">
        <strong id="summary-title">검토 대기</strong>
        <p id="summary-text">URL 탭, iframe 표시, 계획 연결 badge가 함께 보이는지 확인하세요.</p>
      </section>
    </main>

    <script>
      const items = [
        { id: "tab", title: "URL 탭이 표시된다", body: "Prototype 영역에 이 웹앱을 여는 탭이 보입니다.", tag: "required" },
        { id: "iframe", title: "iframe 안에서 앱이 렌더링된다", body: "이 체크리스트가 Plan GUI의 prototype iframe 안에 표시됩니다.", tag: "required" },
        { id: "link", title: "계획 연결 badge가 보인다", body: "Prototype id와 연결된 step/decision badge가 탭 위쪽에 표시됩니다.", tag: "required" },
        { id: "feedback", title: "프로토타입 피드백 target을 선택할 수 있다", body: "Feedback Center에서 prototype target으로 의견을 남길 수 있습니다.", tag: "review" },
        { id: "external", title: "내부 UI는 외부 앱이 책임진다", body: "Plan GUI는 이 체크리스트 내부 구조를 해석하지 않습니다.", tag: "boundary" },
      ];

      const state = new Map(items.map((item) => [item.id, false]));
      const checklist = document.querySelector("#checklist");
      const count = document.querySelector("#count");
      const status = document.querySelector("#status");
      const bar = document.querySelector("#bar");
      const summaryTitle = document.querySelector("#summary-title");
      const summaryText = document.querySelector("#summary-text");

      function render() {
        checklist.innerHTML = "";
        for (const item of items) {
          const done = state.get(item.id);
          const row = document.createElement("label");
          row.className = `item${done ? " done" : ""}`;
          row.innerHTML = `
            <input type="checkbox" ${done ? "checked" : ""} data-id="${item.id}" />
            <span>
              <h2>${item.title}</h2>
              <p>${item.body}</p>
            </span>
            <span class="tag">${item.tag}</span>
          `;
          checklist.append(row);
        }
        updateProgress();
      }

      function updateProgress() {
        const done = [...state.values()].filter(Boolean).length;
        const total = items.length;
        const pct = Math.round((done / total) * 100);
        count.textContent = `${done} / ${total}`;
        status.textContent = done === total ? "검토 완료" : done > 0 ? "검토 진행 중" : "아직 시작 전";
        bar.style.width = `${pct}%`;
        summaryTitle.textContent = done === total ? "모든 항목 완료" : "검토 대기";
        summaryText.textContent =
          done === total
            ? "이 prototype tab은 외부 URL 앱을 iframe으로 표시하는 용도에 충분합니다."
            : "URL 탭, iframe 표시, 계획 연결 badge가 함께 보이는지 확인하세요.";
      }

      checklist.addEventListener("change", (event) => {
        const id = event.target.dataset.id;
        if (!id) return;
        state.set(id, event.target.checked);
        render();
      });

      document.querySelector("#complete-required").addEventListener("click", () => {
        for (const item of items) {
          if (item.tag === "required") state.set(item.id, true);
        }
        render();
      });

      document.querySelector("#reset").addEventListener("click", () => {
        for (const item of items) state.set(item.id, false);
        render();
      });

      render();
    </script>
  </body>
</html>
