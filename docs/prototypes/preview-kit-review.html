<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent GUI Preview Kit Review</title>
    <style>
      :root {
        color: #1f2328;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f6f3ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        display: grid;
        gap: 16px;
        min-height: 100vh;
        padding: 20px;
      }

      .hero {
        background: #fffdf8;
        border: 1px solid #d9d0c1;
        border-radius: 8px;
        display: grid;
        gap: 10px;
        padding: 18px;
      }

      .eyebrow {
        color: #52606d;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
        line-height: 1.2;
      }

      h2 {
        font-size: 18px;
        line-height: 1.3;
      }

      h3 {
        font-size: 14px;
      }

      p,
      li {
        color: #4d5761;
        font-size: 14px;
        line-height: 1.55;
      }

      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card,
      .lane {
        background: #fffdf8;
        border: 1px solid #d9d0c1;
        border-radius: 8px;
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .lane {
        align-content: start;
      }

      .flow {
        display: grid;
        gap: 10px;
      }

      .step {
        background: #f7f9fb;
        border: 1px solid #d6e0e8;
        border-radius: 6px;
        display: grid;
        gap: 4px;
        padding: 10px;
      }

      .step strong {
        font-size: 13px;
      }

      .step span {
        color: #596673;
        font-size: 12px;
        line-height: 1.45;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        background: #eef5fb;
        border: 1px solid #c9d9e8;
        border-radius: 999px;
        color: #245c86;
        font-size: 12px;
        font-weight: 800;
        padding: 4px 8px;
      }

      pre {
        background: #23272e;
        border-radius: 7px;
        color: #f4f6f8;
        font-size: 12px;
        line-height: 1.45;
        margin: 0;
        overflow: auto;
        padding: 12px;
      }

      .decision {
        border-left: 4px solid #246aa8;
      }

      .warn {
        border-left: 4px solid #b7791f;
      }

      ul {
        display: grid;
        gap: 6px;
        margin: 0;
        padding-left: 18px;
      }

      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      const panels = {
        workPlan: {
          title: "최종 변경 작업 하위 그래프",
          eyebrow: "execution graph",
          summary:
            "최종 작업은 스킬/문서/인터페이스 수정과 사용 프로젝트 임시 가이드 작성으로 나눈다. PreviewShell 패널을 먼저 고정하고, 그 다음 소비 프로젝트가 바로 따라 할 문서를 만든다.",
          body: `
            <section class="grid">
              <article class="card decision">
                <h2>작업 순서</h2>
                <div class="flow">
                  <div class="step"><strong>1. PreviewShell 패널 확정</strong><span>PreviewShell/PreviewPanel의 반응형 패널 그리드 범위를 문서와 스킬에 고정한다.</span></div>
                  <div class="step"><strong>2. plan-gui-mcp 스킬 수정</strong><span>target project preview URL 우선, docs/prototypes는 Agent GUI fixture/debug 전용이라고 명시한다.</span></div>
                  <div class="step"><strong>3. MCP/UI 설명 정렬</strong><span>markdownDesc overlay 위치와 iframe URL 소유권 설명을 현재 UI와 맞춘다.</span></div>
                  <div class="step"><strong>4. 소비 프로젝트 임시 가이드 작성</strong><span>npm 배포 전에는 preview app starter를 프로젝트에 복사하고 localhost URL을 iframe에 등록하는 절차를 문서화한다.</span></div>
                </div>
              </article>
              <article class="card">
                <h2>완료 산출물</h2>
                <ul>
                  <li>수정된 plan-gui-mcp 스킬 지침</li>
                  <li>현재 UI와 맞는 MCP tool description</li>
                  <li>review UI 또는 empty/help text의 iframe URL 소유권 설명</li>
                  <li>사용 프로젝트용 임시 preview app 가이드 문서</li>
                  <li>typecheck와 브라우저 확인 결과</li>
                </ul>
              </article>
            </section>
          `,
        },
        strategy: {
          title: "Preview runtime 전략",
          eyebrow: "reviewed ownership boundary",
          summary:
            "repo 확인 결과, Agent GUI의 공통 contract는 iframe URL reference와 선택적 entryPath만 저장한다. 실제 preview HTML/app 소유권은 외부 프로젝트에 두는 모델과 맞다.",
          body: `
            <section class="grid">
              <article class="lane">
                <h2>확인한 Agent GUI 소유 영역</h2>
                <div class="flow">
                  <div class="step"><strong>Schema</strong><span>packages/plan-schema/src/graphPlan.ts의 GraphPlanIframe은 id, description, url, optional entryPath를 가진다.</span></div>
                  <div class="step"><strong>Target</strong><span>GraphPlanTarget은 iframe target을 graphId/nodeId/iframeId로만 식별한다. HTML 내부 의미는 저장하지 않는다.</span></div>
                  <div class="step"><strong>Review UI</strong><span>GraphPane은 선택된 iframe url을 sandbox iframe src로 렌더링한다. DOM 의미를 읽지 않는다.</span></div>
                </div>
              </article>
              <article class="lane">
                <h2>확인한 프로젝트 소유 영역</h2>
                <div class="flow">
                  <div class="step"><strong>Actual UI</strong><span>디자인시스템, 제품 컴포넌트, mock data, state fixture는 대상 프로젝트에서 구성해야 한다.</span></div>
                  <div class="step"><strong>Serving</strong><span>허용 URL은 localhost/127.0.0.1 + explicit port라서 프로젝트 dev server URL을 그대로 연결할 수 있다.</span></div>
                  <div class="step"><strong>Scenario meaning</strong><span>loading, empty, query, error 같은 상태 의미는 Agent GUI schema가 아니라 preview HTML/app이 책임진다.</span></div>
                </div>
              </article>
            </section>
            <section class="card decision">
              <h2>검토 결론</h2>
              <p>Agent GUI가 HTML 생성 의미를 표준화할 필요는 없다. schema/UI는 외부 프로젝트 URL을 iframe reference로 연결하고, entryPath로 source entry 파일만 추적하면 충분하다. 바꿔야 할 부분은 entryPath 계약, 스킬 문구, fixture 설명, UI 도움말이다.</p>
            </section>
          `,
        },
        kit: {
          title: "PreviewShell 최소 형태",
          eyebrow: "responsive panel grid only",
          summary:
            "PreviewShell은 먼저 반응형 패널 그리드 구조만 암시적으로 제공한다. 실제 HTML 작성 품질 가이드는 toolkit 컴포넌트와 스킬에 녹인다.",
          body: `
            <section class="grid">
              <article class="card decision">
                <h2>선택: 반응형 패널 그리드</h2>
                <ul>
                  <li>PreviewShell은 화면 전체 padding, header, grid container만 제공한다.</li>
                  <li>PreviewPanel은 title과 children만 받는 단순 panel이다.</li>
                  <li>grid는 desktop 2열, 좁은 화면 1열로만 반응한다.</li>
                  <li>패널 구조 자체가 “검토 질문 / 실제 화면 / 판단 기준”을 담기 쉬운 기본 틀이 된다.</li>
                </ul>
              </article>
              <article class="card warn">
                <h2>이번에는 제외</h2>
                <ul>
                  <li>StateMatrix, BeforeAfter, ChecklistPanel은 아직 제공하지 않는다.</li>
                  <li>route helper나 manifest helper는 이번 범위에서 제외한다.</li>
                  <li>프로젝트 디자인시스템 컴포넌트는 panel children 안에서 직접 사용한다.</li>
                </ul>
              </article>
            </section>
            <pre>import { PreviewShell, PreviewPanel } from "@agent-gui/preview-kit";

export function SearchPreview() {
  return (
    &lt;PreviewShell title="검색 패널"&gt;
      &lt;PreviewPanel title="입력 상태"&gt;
        &lt;SearchPanel query="invoice" /&gt;
      &lt;/PreviewPanel&gt;
      &lt;PreviewPanel title="검토 기준"&gt;
        &lt;ReviewNotes /&gt;
      &lt;/PreviewPanel&gt;
    &lt;/PreviewShell&gt;
  );
}</pre>
          `,
        },
        interfaceImpact: {
          title: "MCP / 스킬 / 인터페이스 검토 결과",
          eyebrow: "actual repo review",
          summary:
            "실제 파일을 확인한 결과 MCP schema 변경은 entryPath 추가로 작게 제한된다. plan-gui-mcp 스킬과 MCP tool description, UI 도움말에는 현재 구현과 제품 전제가 어긋난 문구가 있다.",
          body: `
            <section class="grid">
              <article class="card decision">
                <h2>확인한 사실</h2>
                <ul>
                  <li>graphPlan.ts는 iframe url을 localhost/127.0.0.1 + explicit port로 제한한다. 외부 프로젝트 dev server 사용에는 충분하다.</li>
                  <li>entryPath는 iframe URL을 만든 workspace source entry 파일만 가리킨다. 상태 의미와 검토 기준은 description 또는 HTML 컨텐츠가 맡는다.</li>
                  <li>graphPlanIframe.test.ts는 https와 file URL을 거부한다. HTML 파일 직접 경로나 원격 hosted URL은 현재 contract 밖이다.</li>
                  <li>GraphPane.tsx는 iframe src에 planRevision만 붙이고 sandbox iframe으로 렌더링한다. preview app 내부 구조를 해석하지 않는다.</li>
                  <li>apps/server/src/main.ts의 /prototypes 서빙은 docs/prototypes/*.html만 basename으로 제공하는 개발 fixture 기능이다.</li>
                </ul>
              </article>
              <article class="card">
                <h2>필요한 변경</h2>
                <ul>
                  <li>plan-gui-mcp SKILL.md의 “Add local HTML routes under docs/prototypes” 문구는 “target project preview URL을 우선 사용, docs/prototypes는 fixture/debug 전용”으로 바꿔야 한다.</li>
                  <li>iframe entry에는 필요할 때 entryPath를 함께 넣어 seed 변환 workflow가 source entry를 읽을 수 있게 한다.</li>
                  <li>MCP stdioServer.ts의 create_graph_plan_session 설명은 markdownDesc가 right detail panel에 렌더링된다고 말한다. 현재 UI는 node 아래 overlay이므로 설명을 고쳐야 한다.</li>
                  <li>Review UI에는 iframe URL이 “Agent GUI가 만든 HTML”이 아니라 “외부 프로젝트가 제공한 local URL”임을 드러내는 짧은 helper가 필요하다.</li>
                  <li>fixture session이나 docs/prototypes 예시는 dev fixture로 명명해야 한다. 실제 도입 예제처럼 보이면 잘못된 운영 모델을 학습시킨다.</li>
                </ul>
              </article>
            </section>
            <pre>{
  "id": "iframe-project-preview",
  "description": "프로젝트 preview",
  "url": "http://localhost:5173/path-owned-by-project",
  "entryPath": "src/agent-gui-preview/project-preview.tsx"
}</pre>
          `,
        },
        adoption: {
          title: "npm 배포 없는 사용 방식",
          eyebrow: "reviewed adoption result",
          summary:
            "npm 배포 없이 시작하려면 template copy가 현재 전제와 가장 잘 맞다. 프로젝트가 preview app 코드를 자기 repo 안에서 직접 소유한다.",
          body: `
            <section class="grid">
              <article class="card decision">
                <h2>검토 결론: template copy</h2>
                <ul>
                  <li>target project 안에 preview app starter를 복사하는 방식이 “HTML은 각 프로젝트가 소유한다”는 전제와 가장 일치한다.</li>
                  <li>Agent GUI repo의 packages를 설치하지 않아도 되므로 npm publish 없이 시작할 수 있다.</li>
                  <li>반복되는 좋은 패턴은 나중에 template 또는 skill 지침으로 회수하고, 검증된 뒤에만 package화를 검토한다.</li>
                </ul>
              </article>
              <article class="card">
                <h2>보류: local file dependency</h2>
                <ul>
                  <li>"@agent-gui/preview-kit": "file:../agent-gui/packages/preview-kit"</li>
                  <li>경로가 개인 환경에 묶이므로 기본 방식으로 삼지 않는다.</li>
                  <li>중앙 kit 변경을 시험할 때만 제한적으로 사용한다.</li>
                </ul>
              </article>
            </section>
            <section class="card">
              <h2>보류: vendor 고정</h2>
              <p>vendor/subtree 방식은 팀 단위 버전 고정에는 좋지만 업데이트 회수 비용이 있다. template copy로 패턴을 검증한 뒤 필요하면 검토한다.</p>
            </section>
          `,
        },
        risks: {
          title: "검토 결과 리스크",
          eyebrow: "observed failure modes",
          summary:
            "실제 repo를 보면 schema보다 문서와 스킬의 메시지가 더 큰 리스크다. fixture 경로가 실사용 경로처럼 읽히면 모델이 잘못 학습된다.",
          body: `
            <section class="grid">
              <article class="card warn">
                <h2>확인된 리스크</h2>
                <ul>
                  <li>plan-gui-mcp 스킬은 아직 docs/prototypes 추가를 표준 단계처럼 안내한다.</li>
                  <li>MCP tool description은 markdownDesc 위치를 right detail panel이라고 설명하지만 현재 UI는 node 아래 overlay다.</li>
                  <li>AGENTS.md는 docs/prototypes를 fixture라고 쓰지만, Node의 iframes[]를 “에이전트가 직접 구성한 HTML 상세 화면”이라고도 써서 실제 소유 경계를 더 명확히 할 필요가 있다.</li>
                  <li>preview-kit이 PreviewShell을 넘어 빠르게 커지면 프로젝트 디자인시스템을 침범할 가능성이 높다.</li>
                </ul>
              </article>
              <article class="card decision">
                <h2>결정된 기준</h2>
                <ul>
                  <li>Agent GUI는 target과 session만 소유한다.</li>
                  <li>프로젝트 preview app은 실제 UI, 상태, HTML 생성 위치를 소유한다.</li>
                  <li>preview-kit 첫 버전은 PreviewShell/PreviewPanel 수준의 패널 그리드로 제한한다.</li>
                  <li>HTML 작성 최소 가이드는 별도 plan node가 아니라 toolkit 구조와 plan-gui-mcp 스킬 지침에 반영한다.</li>
                </ul>
              </article>
            </section>
          `,
        },
      };

      const params = new URLSearchParams(window.location.search);
      const panel = panels[params.get("panel")] ?? panels.strategy;
      document.getElementById("app").innerHTML = `
        <section class="hero">
          <span class="eyebrow">${panel.eyebrow}</span>
          <h1>${panel.title}</h1>
          <p>${panel.summary}</p>
          <div class="tags">
            <span class="tag">project-owned preview</span>
            <span class="tag">iframe contract</span>
            <span class="tag">no npm required</span>
          </div>
        </section>
        ${panel.body}
      `;
    </script>
  </body>
</html>
