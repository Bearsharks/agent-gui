<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype Target Context Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202124;
        background: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(280px, 1fr) 300px;
      }

      .preview {
        padding: 22px;
        display: grid;
        gap: 14px;
        align-content: start;
      }

      .toolbar,
      .panel,
      aside {
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        background: #fff;
      }

      .toolbar {
        min-height: 52px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
      }

      button {
        height: 32px;
        border: 1px solid #c7d2df;
        border-radius: 5px;
        background: #f9fbfd;
        color: #334e68;
        font: inherit;
        font-size: 12px;
        font-weight: 750;
      }

      button.active {
        border-color: #1f5f8f;
        background: #1f5f8f;
        color: #fff;
      }

      .panel {
        min-height: 360px;
        padding: 18px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 20px;
        letter-spacing: 0;
      }

      h2 {
        font-size: 14px;
      }

      p {
        color: #52606d;
        font-size: 13px;
        line-height: 1.45;
      }

      .target {
        margin-top: 18px;
        border: 1px solid #b7c9db;
        border-radius: 7px;
        padding: 14px;
        background: #f4f9ff;
      }

      aside {
        border-width: 0 0 0 1px;
        border-radius: 0;
        padding: 20px;
      }

      .meta {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .meta div {
        border: 1px solid #e0e6ed;
        border-radius: 6px;
        padding: 10px;
        background: #fbfcfd;
        font-size: 12px;
      }

      .meta strong {
        display: block;
        margin-bottom: 4px;
        color: #243b53;
      }

      @media (max-width: 760px) {
        body {
          grid-template-columns: 1fr;
        }

        aside {
          border-width: 1px 0 0;
        }
      }
    </style>
  </head>
  <body>
    <section class="preview">
      <div class="toolbar" aria-label="Prototype tabs">
        <button class="active">리뷰 UI</button>
        <button>탭 선택 상태</button>
        <button>댓글 작성 상태</button>
      </div>
      <main class="panel">
        <h1>대상 맥락을 드러내는 프로토타입</h1>
        <p>선택된 탭이 어떤 그래프 대상과 연결되는지 같은 화면에서 확인한다.</p>
        <section class="target">
          <h2>Selected target</h2>
          <p>g-prototype-review / n-review / b-review</p>
        </section>
      </main>
    </section>
    <aside>
      <h2>Target context</h2>
      <div class="meta">
        <div><strong>Graph</strong>프로토타입 리뷰</div>
        <div><strong>Node</strong>프로토타입 검토</div>
        <div><strong>Iframe</strong>프로토타입 확인 상세 화면</div>
        <div><strong>Feedback anchor</strong>iframe tab</div>
      </div>
    </aside>
  </body>
</html>
